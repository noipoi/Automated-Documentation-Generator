name: Documentation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      # Always generate fresh documentation into build/ so it can be uploaded,
      # even when the committed copy turns out to be stale.
      - name: Generate documentation
        run: python generate_docs.py --src src --output build/DOCUMENTATION.md

      # Baseline for the comparison (not a gate: failure here does not fail the job).
      - name: Generate pdoc HTML (comparison baseline)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m pdoc --output-directory build/pdoc example_package

      # Fails the workflow if DOCUMENTATION.md is missing or differs from fresh output.
      - name: Check committed documentation is up to date
        run: python generate_docs.py --src src --output DOCUMENTATION.md --check

      - name: Upload generated documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-documentation
          path: build/
          if-no-files-found: warn
